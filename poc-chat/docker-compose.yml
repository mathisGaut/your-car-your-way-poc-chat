services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ycyw_chat
      POSTGRES_USER: ycyw
      POSTGRES_PASSWORD: ycyw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ycyw -d ycyw_chat"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "8080:8080"
    environment:
      APP_NAME: "Your Car Your Way Chat POC"
      APP_ENV: local
      APP_KEY: base64:i/nYjegOeMVp0SofWutgluJGwQlEIpaGMeh3oGfPSTM=
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ycyw_chat
      DB_USERNAME: ycyw
      DB_PASSWORD: ycyw
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ycyw-chat
      REVERB_APP_KEY: ycyw-chat-key
      REVERB_APP_SECRET: ycyw-chat-secret
      REVERB_HOST: localhost
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_REVERB_APP_KEY: ycyw-chat-key
      VITE_REVERB_HOST: localhost
      VITE_REVERB_PORT: "8080"
      VITE_REVERB_SCHEME: http
    depends_on:
      - backend

volumes:
  postgres_data:
